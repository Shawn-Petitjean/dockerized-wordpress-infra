secrets:
  db_password:
    file: ../secrets/db_password.txt
  db_root_password:
    file: ../secrets/db_root_password.txt
  credentials:
    file: ../secrets/credentials.txt

volumes:
  db_data:
    driver_opts:
      type: none
      o: bind
      device: /home/shapetit/data/db_data # remplacer login par ton login
  wp_data:
    driver_opts:
      type: none
      o: bind
      device: /home/shapetit/data/wp_data
networks:
  inception:
    driver: bridge
services:
  mariadb:
    build: ./requirements/mariadb
    image: mariadb:inception
    container_name: mariadb
    env_file: [ .env ]
  secrets:
    - db_password
    - db_root_password
    - credentials
  volumes:
    - db_data:/var/lib/mysql
  networks: [ inception ]
  restart: always

wordpress:
  build: ./requirements/wordpress
  image: wordpress:inception
  container_name: wordpress
  depends_on: [ mariadb ] # démarre après mariadb
  env_file: [ .env ]
  secrets:
    - db_password
    - credentials
  volumes:
    - wp_data:/var/www/wordpress
  networks: [ inception ]
  restart: always

nginx:
  build: ./requirements/nginx
  image: nginx:inception
  container_name: nginx
  depends_on: [ wordpress ] # démarre après wordpress
  env_file: [ .env ]
  volumes:
    - wp_data:/var/www/wordpress # même volume que wordpress
  networks: [ inception ]
  ports:
    - "443:443" # seul port exposé à l'extérieur
  restart: always