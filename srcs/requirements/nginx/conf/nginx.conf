server {
listen 443 ssl;
server_name shapetit.42.fr;
ssl_certificate /etc/nginx/ssl/wordpress.crt;
ssl_certificate_key /etc/nginx/ssl/wordpress.key;
ssl_protocols TLSv1.2 TLSv1.3; # OBLIGATOIRE : pas de TLS < 1.2
root /var/www/wordpress;
index index.php index.html;
# Fichiers statiques servis directement par NGINX
location / {
try_files $uri $uri/ /index.php?$args;
}
# PHP transmis à PHP-FPM via FastCGI
location ~ \.php$ {
fastcgi_pass wordpress:9000; # nom du service docker-compose
fastcgi_index index.php;
include fastcgi_params;
fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
}
}